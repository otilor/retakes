name: Release

# Publishes to npm when you push a version tag, e.g. `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm attach a provenance statement

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
